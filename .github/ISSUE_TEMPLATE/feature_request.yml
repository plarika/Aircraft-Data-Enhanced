name: Feature request
description: Propose a receive-only feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal, real-time impact, privacy and licensing impact
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal is receive-only.
          required: true
