name: Source audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/audit_public_repository.py .
      - run: python -m pip install -r tools/requirements.txt
      - run: |
          python tools/test_verified_aircraft_only.py
          python tools/test_active_aircraft_sessions.py
          python tools/test_local_history_database.py
          python tools/test_ui_preferences.py
          python tools/test_vdl2_header_decoder.py
          python tools/test_vdl2_payload_decoder.py
          python tools/test_acars_envelope_parser.py
