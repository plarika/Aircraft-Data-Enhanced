name: P2 stable quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Strict public source audit
        run: python tools/audit_public_repository.py . --strict-public
      - name: Validate P2 stable structure
        run: python tools/validate_p2_stable.py .
      - name: Run Python decoder regressions
        run: |
          python tools/test_vdl2_header_decoder.py
          python tools/test_vdl2_payload_decoder.py
          python tools/test_acars_envelope_parser.py

  windows-build-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.316"
          architecture: x86

      - name: Configure and verify x86 .NET host
        shell: pwsh
        run: |
          if (-not $env:DOTNET_ROOT) {
            throw 'setup-dotnet did not export DOTNET_ROOT.'
          }

          $expectedDotnet = Join-Path $env:DOTNET_ROOT 'dotnet.exe'
          if (-not (Test-Path -LiteralPath $expectedDotnet)) {
            throw "x86 dotnet.exe not found under DOTNET_ROOT: $expectedDotnet"
          }

          $resolvedDotnet = (Get-Command dotnet -ErrorAction Stop).Source
          $expectedFull = [System.IO.Path]::GetFullPath($expectedDotnet)
          $resolvedFull = [System.IO.Path]::GetFullPath($resolvedDotnet)

          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          Write-Host "Resolved dotnet=$resolvedFull"
          Write-Host "Expected x86 dotnet=$expectedFull"

          if (-not $resolvedFull.Equals($expectedFull, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "dotnet on PATH is not the x86 host installed by setup-dotnet."
          }

          "DOTNET_ROOT_X86=$env:DOTNET_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "DOTNET_ROOT_X86=$env:DOTNET_ROOT"
          dotnet --info

      - name: Build compile-only SDR# contracts
        shell: pwsh
        run: |
          dotnet build .\tools\ci-sdrsharp-stubs\SDRSharp.Radio\SDRSharp.Radio.csproj -c Release
          dotnet build .\tools\ci-sdrsharp-stubs\SDRSharp.Common\SDRSharp.Common.csproj -c Release
          New-Item -ItemType Directory -Force .\lib | Out-Null
          Copy-Item .\tools\ci-sdrsharp-stubs\SDRSharp.Radio\bin\Release\net9.0-windows\SDRSharp.Radio.dll .\lib\SDRSharp.Radio.dll -Force
          Copy-Item .\tools\ci-sdrsharp-stubs\SDRSharp.Common\bin\Release\net9.0-windows\SDRSharp.Common.dll .\lib\SDRSharp.Common.dll -Force

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\AircraftDataEnhanced.sln -p:Platform=x86

      - name: Build solution
        shell: pwsh
        run: dotnet build .\AircraftDataEnhanced.sln -c Release -p:Platform=x86 --no-restore

      - name: Run C# regression suite
        shell: pwsh
        run: dotnet run --project .\tests\AircraftDataEnhanced.Tests\AircraftDataEnhanced.Tests.csproj -c Release -p:Platform=x86 --no-build -- --skip-sdk-abi
